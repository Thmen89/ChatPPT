# ChatPPT on Postgres instead of the default SQLite file. Only for many users or an
# existing Postgres; SQLite in the data folder is the right default for everyone else.
#
#   docker compose -f deploy/compose.postgres.yml up -d
#
# The only ChatPPT setting involved is server.database_url. Back up the database with
# pg_dump; `chatppt backup` covers the files in /data.
services:
  chatppt:
    image: ghcr.io/thmen89/chatppt:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./chatppt:/data
    environment:
      CHATPPT_SERVER__DATABASE_URL: postgresql://chatppt:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/chatppt
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatppt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: chatppt
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatppt -d chatppt"]
      interval: 5s
      timeout: 3s
      retries: 20
