# ChatPPT: one service, one data folder.
#
#   CHATPPT_LLM__PROVIDER=openai CHATPPT_LLM__PROVIDERS__OPENAI__API_KEY=sk-... docker compose up -d
#
# Or leave the environment empty and pick a provider in the settings screen at
# http://localhost:5000. Everything else goes in ./chatppt/chatppt.toml
# (docs/config-reference.md); deploy/ has a Postgres and a dev variant.
services:
  chatppt:
    image: ghcr.io/thmen89/chatppt:latest   # or :full for LibreOffice, OCR and memory
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./chatppt:/data
    environment:
      # Passed through only when set in your shell (an empty value would count as set).
      - CHATPPT_LLM__PROVIDER
      - CHATPPT_LLM__MODEL
      - CHATPPT_LLM__PROVIDERS__OPENAI__API_KEY
      - CHATPPT_LLM__PROVIDERS__ANTHROPIC__API_KEY
      - CHATPPT_LLM__PROVIDERS__GOOGLE__API_KEY
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
